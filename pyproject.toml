[project]
name = "codie-as-a-service"
version = "0.1.0"
description = "Microservice for per-user agent identity and memory"
authors = [
    {name = "Izzy Fuller"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "transformers (>=5.0.0)",
    "mlx-lm (>=0.30.0)",

    "google-cloud-firestore (>=2.22.0,<3.0.0)",
    "google-cloud-pubsub (>=2.26.0,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "synapse @ git+https://github.com/IzzyFuller/synapse.git@main",
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pika (>=1.3.0,<2.0.0)",
    "python-dotenv>=1.2.1",
    "outlines (>=0.2.0)",
    "mcp (>=1.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
demo = [
    "gradio (>=5.0.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "tests/*",
    "*/protocols.py",
    "*/main.py",
    "*/main_http.py",
    "*/main_pubsub.py",
]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "src"
packages = ["codie_as_a_service"]
explicit_package_bases = true
# Relaxed for now - tighten as codebase matures
disable_error_code = ["attr-defined", "arg-type", "call-arg"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]
