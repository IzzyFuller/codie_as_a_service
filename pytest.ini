[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --cov=src/codie_as_a_service
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=100
    --cov-config=pyproject.toml
markers =
    integration: Integration tests using emulators
    unit: Unit tests with mocks only
